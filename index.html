<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142321"><link rel="icon" href="data:,"><title>Zellatlas · Interaktives Zellmodell</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true"><i></i></span>Zellatlas</div>
  <span class="subject">Biologie <b> / </b> Oberstufe</span>
  <nav class="species" aria-label="Zelltyp wählen">
    <button data-cell="animal" aria-pressed="true"><i data-icon="animal"></i>Tierzelle</button>
    <button data-cell="plant" aria-pressed="false"><i data-icon="plant"></i>Pflanzenzelle</button>
    <button data-cell="ciliate" aria-pressed="false"><i data-icon="ciliate"></i>Pantoffeltierchen</button>
  </nav>
  <button class="quiet handbook" id="help"><i data-icon="book"></i><span>Bedienung</span></button>
</header>
<main>
  <section id="stage" aria-label="Modellansicht">
    <canvas tabindex="0" id="scene" aria-label="3D-Modell. Pfeiltasten drehen, Plus und Minus zoomen. Strukturen sind auch in der Liste auswählbar."></canvas>
    <div id="fallback" hidden></div>
    <div class="intro">
      <nav id="crumbs" aria-label="Betrachtungsebene"></nav>
      <h1 id="title">Tierzelle</h1><p id="subtitle">Typische tierische Körperzelle</p>
    </div>
    <div class="view-controls">
      <div class="segment" aria-label="Darstellung"><button id="cut" aria-pressed="true"><i data-icon="section"></i>Schnittansicht</button><button id="whole" aria-pressed="false"><i data-icon="whole"></i>Ganzes Modell</button></div>
      <button class="square" id="full" aria-label="Vollbild" title="Vollbild"><i data-icon="full"></i></button>
    </div>
    <div id="labels"></div>
    <div class="bottom">
      <button id="catalog" class="primary"><i data-icon="layers"></i><span>Bestandteile</span><small id="count"></small></button>
      <div class="tools">
        <button id="minus" aria-label="Verkleinern" title="Verkleinern">−</button><output id="magnification">100 %</output><button id="plus" aria-label="Vergrößern" title="Vergrößern">+</button>
        <span class="rule"></span><button class="tool-icon" id="reset" aria-label="Ansicht zurücksetzen" title="Ansicht zurücksetzen"><i data-icon="reset"></i></button><button class="tool-icon" id="names" aria-label="Beschriftungen" aria-pressed="true" title="Beschriftungen"><i data-icon="tag"></i></button>
      </div>
    </div>
  </section>
  <aside id="drawer" hidden aria-label="Modellinformationen">
    <div class="drawer-top"><span id="sectionName"></span><button class="square" id="close" aria-label="Schließen"><i data-icon="close"></i></button></div>
    <div id="content"></div>
  </aside>
</main>
<footer><span class="engine"><b></b><span id="status">3D-Modell</span></span><span class="gesture"><i data-icon="rotate"></i> Ziehen zum Drehen <b>·</b> Scrollen oder Pinch zum Zoomen</span><button id="sources"><i data-icon="info"></i> Modell &amp; Quellen</button></footer>
<script src="vendor/three.min.js"></script><script src="biology.js"></script><script src="models.js"></script><script src="fallback.js"></script><script src="view.js"></script><script src="app.js"></script>
</body></html>
